name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build -- --base-href=/ng-nordpool/
        env:
          NORDPOOL_API_URL: ${{ secrets.NORDPOOL_API_URL }}

      # GitHub Pages needs a 404.html to handle client-side routing
      - run: cp dist/ng-nordpool/browser/index.html dist/ng-nordpool/browser/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/ng-nordpool/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
